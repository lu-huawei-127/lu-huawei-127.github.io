<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>陆华为 · 个人简历</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background: #030712;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 1.5rem;
            position: relative;
            overflow-x: hidden;
        }
        .glow-1 {
            position: fixed;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(34,211,238,0.15) 0%, transparent 70%);
            filter: blur(140px);
            top: -100px;
            left: -100px;
            z-index: 0;
            pointer-events: none;
        }
        .glow-2 {
            position: fixed;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(99,102,241,0.12) 0%, transparent 70%);
            filter: blur(140px);
            bottom: -100px;
            right: -100px;
            z-index: 0;
            pointer-events: none;
        }
        .container {
            position: relative;
            z-index: 1;
            max-width: 1024px;
            margin: 0 auto;
        }
        .glass {
            background: rgba(15,23,42,0.6);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 1.5rem;
            padding: 1.5rem 2rem;
            transition: all 0.3s ease;
        }
        .glass:hover {
            border-color: rgba(34,211,238,0.25);
            box-shadow: 0 0 30px rgba(34,211,238,0.05);
            transform: translateY(-2px);
        }
        .badge {
            background: rgba(34,211,238,0.1);
            border: 1px solid rgba(34,211,238,0.2);
            color: #67e8f9;
            padding: 0.2rem 0.8rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
        }
        .btn-glow {
            background: rgba(34,211,238,0.08);
            border: 1px solid rgba(34,211,238,0.2);
            color: #67e8f9;
            padding: 0.6rem 1.5rem;
            border-radius: 9999px;
            font-weight: 600;
            transition: all 0.3s ease;
            cursor: pointer;
            display: inline-block;
            text-decoration: none;
        }
        .btn-glow:hover {
            background: rgba(34,211,238,0.2);
            box-shadow: 0 0 30px rgba(34,211,238,0.2);
            transform: translateY(-2px);
        }
        .skill-tag {
            background: rgba(34,211,238,0.06);
            border: 1px solid rgba(34,211,238,0.12);
            color: #94a3b8;
            padding: 0.3rem 1rem;
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 500;
        }
        .cert-img {
            width: 100%;
            max-height: 160px;
            object-fit: contain;
            border-radius: 0.75rem;
            margin-top: 0.75rem;
            border: 1px solid rgba(255,255,255,0.06);
            transition: transform 0.2s;
            cursor: pointer;
        }
        .cert-img:hover {
            transform: scale(1.02);
            border-color: rgba(34,211,238,0.3);
        }
        @media (max-width: 640px) {
            .glass { padding: 1.2rem 1.2rem; }
            .container { padding: 0 0.5rem; }
            body { padding: 0.8rem; }
            .cert-img { max-height: 120px; }
        }
        @media print {
            .glow-1, .glow-2 { display: none; }
            body { background: #fff; color: #000; }
            .glass { background: #fff !important; backdrop-filter: none !important; border-color: #ccc; }
            .badge { background: #eee; color: #000; border-color: #999; }
            .skill-tag { background: #f0f0f0; color: #333; border-color: #ddd; }
            .btn-glow { display: none; }
            .cert-img { border-color: #ccc; max-height: 100px; }
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: rgba(15,23,42,0.8);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.1);
            color: #e2e8f0;
            padding: 0.8rem 2rem;
            border-radius: 9999px;
            font-size: 0.9rem;
